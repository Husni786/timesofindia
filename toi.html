<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOI Clone</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <header class="sticky-top">
    <nav class="navbar navbar-expand-lg bg-white">
      <div class="container">
        <a class="navbar-brand" href="#">
          <img src="img/logo.png" alt="TOI Logo" width="150">
        </a>
        <button class="navbar-toggler" id="mobileMenu">☰</button>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav">
            <li class="nav-item"><a href="#" class="nav-link">Latest News</a></li>
            <li class="nav-item"><a href="#" class="nav-link">India</a></li>
            <li class="nav-item"><a href="#" class="nav-link">World</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="container mt-4">
    <div class="row">
      <!-- Featured Article -->
      <div class="col-lg-8">
        <article class="featured-article">
          <img src="img/featured.jpg" class="img-fluid">
          <h1>Headline of the Day</h1>
          <p>Article content...</p>
        </article>
      </div>

      <!-- Trending News Sidebar -->
      <div class="col-lg-4">
        <div class="trending-news">
          <h3>Trending</h3>
          <ul>
            <li><a href="#">Trending News 1</a></li>
            <li><a href="#">Trending News 2</a></li>
          </ul>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white mt-5 py-4">
    <div class="container">
      <div class="row">
        <div class="col-md-3">
          <h5>Sections</h5>
          <ul>
            <li><a href="#">India</a></li>
            <li><a href="#">World</a></li>
          </ul>
        </div>
        <!-- Add more footer columns -->
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/script.js"></script>
</body>
</html>
